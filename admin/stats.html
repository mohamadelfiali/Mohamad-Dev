<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإحصاءيات — Mohamad | Dev</title>
<link rel="icon" type="image/png" href="https://i.postimg.cc/ryJ4HQP1/13a086e8-4578-4012-944b-3aec0aa98aaf.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<style>
:root{--bg:#0f1115;--bg2:#161a22;--bg3:#1d2330;--border:#252c3a;--text:#e9ecf2;--muted:#8a93a6;--accent:#4d9fff;--accent-soft:rgba(77,159,255,.12);--gold:#f59e0b;--danger:#f0555a;--ok:#10b981;--radius:14px}
html[data-theme="light"]{--bg:#f6f7fa;--bg2:#fff;--bg3:#eef1f6;--border:#e3e7ee;--text:#171b23;--muted:#616b7e;--accent:#2563eb;--accent-soft:rgba(37,99,235,.09);--gold:#d97706;--danger:#dc2626;--ok:#059669}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
a{color:inherit;text-decoration:none}
.container{max-width:1000px;margin:0 auto;padding:0 20px}

#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:36px;width:100%;max-width:380px;text-align:center}
.login-box img{width:60px;height:60px;border-radius:50%;border:3px solid var(--accent);margin-bottom:12px}
.field{margin:14px 0}
.field input{width:100%;padding:12px 14px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:.95rem;outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:10px;font-weight:700;font-size:.95rem;cursor:pointer;border:none;transition:.2s;width:100%;font-family:inherit}
.btn-accent{background:var(--accent);color:#fff}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.5}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);padding:9px 18px;border:1px solid var(--border);border-radius:10px;font-size:.88rem;font-weight:700;transition:.2s;background:var(--bg2)}
.back-link:hover{color:var(--accent);border-color:var(--accent)}

h1{font-size:1.7rem;font-weight:800;text-align:center;padding:36px 0 8px}
.sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:30px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:26px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:22px;text-align:center;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
.stat-card.gold::before{background:var(--gold)}
.stat-card .num{font-size:2.2rem;font-weight:800;color:var(--accent)}
.stat-card.gold .num{color:var(--gold)}
.stat-card .lbl{color:var(--muted);font-size:.85rem;margin-top:4px}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:22px}
.card h3{font-size:1.05rem;font-weight:800;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}

.rank-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--border);transition:.2s}
.rank-row:last-child{border-bottom:none}
.rank-row:hover{background:var(--bg3)}
.rank-num{width:28px;height:28px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:var(--muted);flex-shrink:0}
.rank-row:first-child .rank-num{background:var(--gold);color:#fff}
.rank-row:nth-child(2) .rank-num{background:var(--accent);color:#fff}
.rank-info{flex:1;min-width:0}
.rank-info strong{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-bar{height:6px;background:var(--bg3);border-radius:3px;margin-top:5px;overflow:hidden}
.rank-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .8s ease}
.rank-count{font-weight:800;color:var(--accent);font-size:1rem;flex-shrink:0}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:.9rem}

/* رسم بياني 7 أيام */
.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding:10px 4px 0}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart-bar{width:100%;max-width:44px;background:var(--accent);border-radius:6px 6px 0 0;min-height:4px;transition:height .8s ease;opacity:.85}
.chart-bar:hover{opacity:1}
.chart-num{font-size:.72rem;font-weight:700;color:var(--muted)}
.chart-day{font-size:.7rem;color:var(--muted)}

.danger-zone{display:flex;justify-content:flex-end}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);width:auto;padding:9px 18px;font-size:.85rem}
.btn-danger:hover{background:var(--danger);color:#fff}

#panel{display:none}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <img src="https://i.postimg.cc/ryJ4HQP1/13a086e8-4578-4012-944b-3aec0aa98aaf.png" alt="">
    <h2 style="margin-bottom:6px">الإحصاءيات</h2>
    <p style="color:var(--muted);font-size:.85rem;margin-bottom:16px">دخول المسؤول فقط</p>
    <div class="field"><input type="email" id="loginEmail" placeholder="البريد الإلكتروني" autocomplete="username"></div>
    <div class="field"><input type="password" id="loginPassword" placeholder="كلمة السر" autocomplete="current-password" onkeypress="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-accent" id="loginBtn" onclick="doLogin()">دخول</button>
  </div>
</div>

<div id="panel" class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;padding-top:26px;flex-wrap:wrap;gap:10px">
    <a class="back-link" href="admin/index.html" target="_blank">← لوحة التحكم</a>
    <button class="btn btn-danger" onclick="refreshStats()">تحديث</button>
  </div>
  <h1>📊 إحصاءيات الموقع</h1>
  <p class="sub">بيانات حقيقية مسجلة من زوار موقعك</p>

  <div class="stats-grid">
    <div class="stat-card"><div class="num" id="stVisits">0</div><div class="lbl">زيارات الموقع</div></div>
    <div class="stat-card gold"><div class="num" id="stToolClicks">0</div><div class="lbl">نقرات الأدوات</div></div>
    <div class="stat-card"><div class="num" id="stArticleOpens">0</div><div class="lbl">فتح المقالات</div></div>
    <div class="stat-card"><div class="num" id="stToday">0</div><div class="lbl">نشاط اليوم</div></div>
  </div>

  <div class="card">
    <h3>النشاط — آخر 7 أيام</h3>
    <div class="chart" id="chart7"></div>
  </div>

  <div class="card">
    <h3>🏆 أكثر الأدوات نقراً</h3>
    <div id="topTools"></div>
  </div>

  <div class="card">
    <h3>📖 أكثر المقالات قراءة</h3>
    <div id="topArticles"></div>
  </div>

  <div class="card danger-zone">
    <button class="btn btn-danger" onclick="clearStats()">مسح كل الإحصاءيات</button>
  </div>
</div>

<script>
function setTheme(t){document.documentElement.setAttribute('data-theme',t);}
setTheme(localStorage.getItem('md-theme')||'dark');
var auth={email:'',password:''};

async function api(action,extra){
  var body=Object.assign({action:action,email:auth.email,password:auth.password},extra||{});
  var res=await fetch(APP_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  var j=await res.json();
  if(!j.success)throw new Error(j.error||'خطأ');
  return j.data;
}

async function doLogin(){
  var email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;
  var btn=document.getElementById('loginBtn');
  if(!email||!password)return;
  btn.disabled=true;btn.textContent='...';
  try{
    auth={email:email,password:password};
    await api('login');
    sessionStorage.setItem('md_auth',JSON.stringify(auth));
    showPanel();
  }catch(e){alert('بيانات غير صحيحة');}
  finally{btn.disabled=false;btn.textContent='دخول';}
}

function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function dayKey(d){var x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}

function showPanel(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('panel').style.display='block';
  refreshStats();
}

async function refreshStats(){
  try{
    var data=await api('getClicks');
    renderStats(data.clicks||[]);
  }catch(e){alert('تعذر التحميل: '+e.message);}
}

function renderStats(clicks){
  var visits=clicks.filter(function(c){return c.type==='visit';});
  var toolClicks=clicks.filter(function(c){return c.type==='tool';});
  var articleOpens=clicks.filter(function(c){return c.type==='article';});
  var today=dayKey(new Date());
  var todayCount=clicks.filter(function(c){return dayKey(c.date)===today;}).length;

  document.getElementById('stVisits').textContent=visits.length;
  document.getElementById('stToolClicks').textContent=toolClicks.length;
  document.getElementById('stArticleOpens').textContent=articleOpens.length;
  document.getElementById('stToday').textContent=todayCount;

  // رسم 7 أيام
  var days=[],counts=[];
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    days.push(d);counts.push(0);
  }
  clicks.forEach(function(c){
    var k=dayKey(c.date);
    days.forEach(function(d,idx){if(dayKey(d)===k)counts[idx]++;});
  });
  var max=Math.max.apply(null,counts.concat([1]));
  document.getElementById('chart7').innerHTML=days.map(function(d,i){
    var h=Math.max(4,(counts[i]/max)*130);
    var label=d.toLocaleDateString('ar',{weekday:'short'});
    return '<div class="chart-col"><span class="chart-num">'+counts[i]+'</span>'+
      '<div class="chart-bar" style="height:'+h+'px"></div>'+
      '<span class="chart-day">'+label+'</span></div>';
  }).join('');

  // أعلى الأدوات
  renderTop('topTools',countBy(toolClicks));
  renderTop('topArticles',countBy(articleOpens));
}

function countBy(arr){
  var map={};
  arr.forEach(function(c){
    var key=c.id||c.title||'؟';
    if(!map[key])map[key]={title:c.title||key,count:0};
    map[key].count++;
  });
  return Object.values(map).sort(function(a,b){return b.count-a.count;}).slice(0,10);
}

function renderTop(elId,items){
  var el=document.getElementById(elId);
  if(!items.length){el.innerHTML='<div class="empty">لا توجد بيانات بعد — ستظهر هنا تلقائياً مع زيارات موقعك</div>';return;}
  var max=items[0].count;
  el.innerHTML=items.map(function(it,i){
    return '<div class="rank-row"><span class="rank-num">'+(i+1)+'</span>'+
    '<div class="rank-info"><strong>'+esc(it.title)+'</strong>'+
    '<div class="rank-bar"><div class="rank-bar-fill" style="width:'+Math.round((it.count/max)*100)+'%"></div></div></div>'+
    '<span class="rank-count">'+it.count+'</span></div>';
  }).join('');
}

async function clearStats(){
  if(!confirm('مسح كل الإحصاءيات نهائياً؟'))return;
  try{await api('clearClicks');refreshStats();}catch(e){alert(e.message);}
}

(function init(){
  var saved=sessionStorage.getItem('md_auth');
  if(saved){try{auth=JSON.parse(saved);showPanel();return;}catch(e){}}
  document.getElementById('loginScreen').style.display='block';
})();
</script>
</body>
</html>
