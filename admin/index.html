<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم — Mohamad | Dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="../config.js"></script>
<style>
:root {
  --bg:#0f1115; --bg2:#161a22; --bg3:#1d2330;
  --border:#252c3a; --text:#e9ecf2; --muted:#8a93a6;
  --accent:#4d9fff; --accent-soft:rgba(77,159,255,.12);
  --danger:#f0555a; --ok:#10b981; --warn:#f59e0b;
  --radius:14px;
}
html[data-theme="light"] {
  --bg:#f6f7fa; --bg2:#ffffff; --bg3:#eef1f6;
  --border:#e3e7ee; --text:#171b23; --muted:#616b7e;
  --accent:#2563eb; --accent-soft:rgba(37,99,235,.09);
  --danger:#dc2626; --ok:#059669; --warn:#d97706;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--text);
  line-height:1.7; min-height:100vh; transition:background .3s,color .3s;
}
input,textarea,select,button { font-family:inherit; }
.container { max-width:1000px; margin:0 auto; padding:0 20px; }

/* ═══ شاشة الدخول ═══ */
#loginScreen {
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
}
.login-box {
  background:var(--bg2); border:1px solid var(--border); border-radius:18px;
  padding:40px 34px; width:100%; max-width:400px;
  animation:fadeUp .5s ease both;
}
.login-box .logo { text-align:center; margin-bottom:28px; }
.login-box .logo img {
  width:64px; height:64px; border-radius:50%; margin:0 auto 12px;
  border:3px solid var(--accent); display:block;
}
.login-box .logo h1 { font-size:1.3rem; font-weight:800; }
.login-box .logo p { color:var(--muted); font-size:.85rem; }
.field { margin-bottom:16px; }
.field label {
  display:block; font-size:.83rem; font-weight:700; color:var(--muted);
  margin-bottom:6px;
}
.field input, .field textarea {
  width:100%; padding:12px 14px; background:var(--bg); color:var(--text);
  border:1px solid var(--border); border-radius:10px; font-size:.95rem;
  outline:none; transition:.2s;
}
.field input:focus, .field textarea:focus {
  border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
}
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 22px; border-radius:10px; font-weight:700; font-size:.95rem;
  cursor:pointer; border:1px solid transparent; transition:.2s; width:100%;
}
.btn:disabled { opacity:.55; cursor:not-allowed; }
.btn-accent { background:var(--accent); color:#fff; }
.btn-accent:hover:not(:disabled) { filter:brightness(1.1); transform:translateY(-2px); }
.btn-danger { background:transparent; border-color:var(--danger); color:var(--danger); }
.btn-danger:hover { background:var(--danger); color:#fff; }
.btn-ghost {
  background:transparent; border-color:var(--border); color:var(--text);
  width:auto; padding:9px 18px; font-size:.88rem;
}
.btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
.login-error {
  background:rgba(240,85,90,.1); border:1px solid var(--danger); color:var(--danger);
  border-radius:10px; padding:10px 14px; font-size:.87rem; margin-bottom:16px;
  display:none;
}

/* ═══ اللوحة ═══ */
#panel { display:none; }
.topbar {
  background:var(--bg2); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:50;
}
.topbar-inner {
  display:flex; align-items:center; justify-content:space-between;
  height:62px; gap:10px;
}
.topbar .title { font-weight:800; font-size:1.05rem; }
.topbar .title span { color:var(--accent); }
.topbar-actions { display:flex; gap:8px; align-items:center; }
.tabs { display:flex; gap:8px; margin:26px 0 22px; }
.tab-btn {
  flex:1; padding:12px; border-radius:12px; border:1px solid var(--border);
  background:var(--bg2); color:var(--muted); font-weight:700; font-size:.95rem;
  cursor:pointer; transition:.2s;
}
.tab-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

.card {
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
  padding:24px; margin-bottom:22px;
}
.card h3 {
  font-size:1.05rem; font-weight:800; margin-bottom:18px;
  padding-bottom:12px; border-bottom:1px solid var(--border);
}
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:700px) { .grid-2 { grid-template-columns:1fr; } }

/* ═══ رفع الصور ═══ */
.img-upload-zone {
  border:2px dashed var(--border); border-radius:12px; padding:20px;
  text-align:center; cursor:pointer; transition:.2s; color:var(--muted);
  font-size:.88rem;
}
.img-upload-zone:hover { border-color:var(--accent); color:var(--accent); }
.img-preview-wrap { display:none; margin-top:12px; position:relative; }
.img-preview-wrap img {
  width:100%; max-height:200px; object-fit:cover; border-radius:10px;
  border:1px solid var(--border);
}
.img-preview-wrap .remove-img {
  position:absolute; top:8px; left:8px; background:var(--danger); color:#fff;
  border:none; border-radius:8px; padding:5px 12px; cursor:pointer;
  font-size:.78rem; font-weight:700;
}
.upload-status { font-size:.8rem; margin-top:8px; color:var(--warn); min-height:18px; }
.upload-status.done { color:var(--ok); }
.upload-status.err { color:var(--danger); }

/* ═══ محرر Markdown ═══ */
.md-editor { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:800px) { .md-editor { grid-template-columns:1fr; } }
.md-editor textarea {
  min-height:340px; resize:vertical; background:var(--bg); color:var(--text);
  border:1px solid var(--border); border-radius:10px; padding:14px;
  font-family:'Courier New',monospace; font-size:.88rem; direction:ltr; text-align:left;
  outline:none; line-height:1.8;
}
.md-editor textarea:focus { border-color:var(--accent); }
.md-preview {
  background:var(--bg); border:1px solid var(--border); border-radius:10px;
  padding:14px; min-height:340px; overflow-y:auto; max-height:500px;
}
.md-editor-label { font-size:.78rem; color:var(--muted); margin-bottom:6px; font-weight:700; }
.md-preview h1,.md-preview h2,.md-preview h3 { margin:16px 0 8px; }
.md-preview h2 { color:var(--accent); }
.md-preview p { margin:8px 0; }
.md-preview ul,.md-preview ol { margin:8px 22px; }
.md-preview code { background:var(--bg3); padding:2px 6px; border-radius:5px; direction:ltr; display:inline-block; }
.md-preview pre { background:var(--bg3); padding:12px; border-radius:8px; direction:ltr; text-align:left; overflow-x:auto; margin:10px 0; }
.md-preview pre code { background:none; }
.md-preview blockquote { border-right:3px solid var(--accent); padding:8px 14px; color:var(--muted); margin:10px 0; background:var(--accent-soft); border-radius:6px; }
.md-preview img { max-width:100%; border-radius:8px; }
.md-preview a { color:var(--accent); }

/* ═══ قوائم العناصر ═══ */
.item-row {
  display:flex; align-items:center; gap:14px; padding:12px;
  border:1px solid var(--border); border-radius:12px; margin-bottom:10px;
  transition:.2s;
}
.item-row:hover { border-color:var(--accent); }
.item-thumb {
  width:64px; height:48px; border-radius:8px; object-fit:cover;
  background:var(--bg3); flex-shrink:0;
}
.item-info { flex:1; min-width:0; }
.item-info strong { display:block; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-info small { color:var(--muted); font-size:.78rem; }
.item-actions { display:flex; gap:6px; flex-shrink:0; }
.mini-btn {
  padding:7px 14px; border-radius:8px; border:1px solid var(--border);
  background:transparent; color:var(--text); font-size:.8rem; font-weight:700;
  cursor:pointer; transition:.2s;
}
.mini-btn.edit:hover { border-color:var(--accent); color:var(--accent); }
.mini-btn.del:hover { border-color:var(--danger); color:var(--danger); }
.empty-list { text-align:center; color:var(--muted); padding:26px; font-size:.9rem; }

/* ═══ Toast ═══ */
.toast {
  position:fixed; bottom:24px; right:50%; transform:translateX(50%);
  padding:13px 26px; border-radius:12px; font-weight:700; font-size:.9rem;
  z-index:1000; animation:toastIn .3s ease; box-shadow:0 8px 30px rgba(0,0,0,.3);
}
.toast.ok { background:var(--ok); color:#fff; }
.toast.err { background:var(--danger); color:#fff; }
@keyframes toastIn { from { opacity:0; transform:translate(50%,20px);} to { opacity:1; transform:translate(50%,0);} }
@keyframes fadeUp { from { opacity:0; transform:translateY(20px);} to { opacity:1; transform:none;} }
.hidden { display:none !important; }
</style>
</head>
<body>

<!-- ═══════════ شاشة تسجيل الدخول ═══════════ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="logo">
      <img src="https://i.postimg.cc/ryJ4HQP1/13a086e8-4578-4012-944b-3aec0aa98aaf.png" alt="logo">
      <h1>Mohamad <span style="color:var(--accent)">|</span> Dev</h1>
      <p>لوحة التحكم — دخول المسؤول فقط</p>
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>كلمة السر</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"
             onkeypress="if(event.key==='Enter') doLogin()">
    </div>
    <button class="btn btn-accent" id="loginBtn" onclick="doLogin()">تسجيل الدخول</button>
  </div>
</div>

<!-- ═══════════ اللوحة ═══════════ -->
<div id="panel">
  <div class="topbar">
    <div class="container topbar-inner">
      <div class="title">لوحة التحكم <span>|</span> Mohamad Dev</div>
      <div class="topbar-actions">
        <a class="btn btn-ghost" href="../index.html" target="_blank">عرض الموقع ↗</a>
        <button class="btn btn-ghost" onclick="logout()">خروج</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" id="tabTools" onclick="switchTab('tools')">🛠️ الأدوات</button>
      <button class="tab-btn" id="tabArticles" onclick="switchTab('articles')">📝 المقالات</button>
    </div>

    <!-- ═══ تبويب الأدوات ═══ -->
    <div id="toolsTab">
      <div class="card">
        <h3 id="toolFormTitle">➕ إضافة أداة جديدة</h3>
        <input type="hidden" id="toolEditingId" value="">
        <div class="field">
          <label>عنوان الأداة *</label>
          <input type="text" id="toolTitle" placeholder="مثال: KeepAliveMC">
        </div>
        <div class="field">
          <label>الوصف القصير *</label>
          <input type="text" id="toolDesc" placeholder="وصف بسيط يظهر تحت العنوان">
        </div>
        <div class="field">
          <label>رابط الأداة *</label>
          <input type="url" id="toolUrl" placeholder="https://..." dir="ltr">
        </div>
        <div class="field">
          <label>صورة الأداة *</label>
          <div class="img-upload-zone" onclick="document.getElementById('toolImgInput').click()">
            📷 اضغط لاختيار صورة (حتى 5MB)
          </div>
          <input type="file" id="toolImgInput" accept="image/*" class="hidden" onchange="handleImage(this,'tool')">
          <div class="img-preview-wrap" id="toolImgPreviewWrap">
            <img id="toolImgPreview" src="" alt="">
            <button class="remove-img" onclick="removeImage('tool')">✕ إزالة</button>
          </div>
          <div class="upload-status" id="toolImgStatus"></div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-accent" id="toolSubmitBtn" onclick="submitTool()">🚀 نشر الأداة</button>
          <button class="btn btn-ghost hidden" id="toolCancelBtn" onclick="cancelToolEdit()">إلغاء</button>
        </div>
      </div>

      <div class="card">
        <h3>📋 الأدوات المنشورة (<span id="toolsCount">0</span>)</h3>
        <div id="toolsList"></div>
      </div>
    </div>

    <!-- ═══ تبويب المقالات ═══ -->
    <div id="articlesTab" class="hidden">
      <div class="card">
        <h3 id="articleFormTitle">✍️ إنشاء مقال جديد</h3>
        <input type="hidden" id="articleEditingId" value="">
        <div class="grid-2">
          <div class="field">
            <label>عنوان المقال *</label>
            <input type="text" id="articleTitle" placeholder="عنوان جذاب للمقال">
          </div>
          <div class="field">
            <label>الوصف القصير *</label>
            <input type="text" id="articleDesc" placeholder="يظهر في بطاقة المقال">
          </div>
        </div>
        <div class="field">
          <label>صورة الغلاف *</label>
          <div class="img-upload-zone" onclick="document.getElementById('articleImgInput').click()">
            🖼️ اضغط لاختيار صورة غلاف (حتى 5MB)
          </div>
          <input type="file" id="articleImgInput" accept="image/*" class="hidden" onchange="handleImage(this,'article')">
          <div class="img-preview-wrap" id="articleImgPreviewWrap">
            <img id="articleImgPreview" src="" alt="">
            <button class="remove-img" onclick="removeImage('article')">✕ إزالة</button>
          </div>
          <div class="upload-status" id="articleImgStatus"></div>
        </div>
        <div class="field">
          <div class="md-editor">
            <div>
              <div class="md-editor-label">✏️ المحتوى (Markdown)</div>
              <textarea id="articleContent" placeholder="# عنوان&#10;&#10;اكتب مقالك هنا بصيغة Markdown...&#10;&#10;## عنوان فرعي&#10;- نقطة أولى&#10;- نقطة ثانية&#10;&#10;**نص عريض** و *نص مائل*" oninput="previewMd()"></textarea>
            </div>
            <div>
              <div class="md-editor-label">👁️ المعاينة المباشرة</div>
              <div class="md-preview" id="mdPreview"></div>
            </div>
          </div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-accent" id="articleSubmitBtn" onclick="submitArticle()">🚀 نشر المقال</button>
          <button class="btn btn-ghost hidden" id="articleCancelBtn" onclick="cancelArticleEdit()">إلغاء</button>
        </div>
      </div>

      <div class="card">
        <h3>📚 المقالات المنشورة (<span id="articlesCount">0</span>)</h3>
        <div id="articlesList"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════ حالة عامة ═══════════
var auth = { email: '', password: '' };
var uploadedImages = { tool: '', article: '' };
var DATA = { tools: [], articles: [] };

// ═══════════ فحص الإعداد ═══════════
function isConfigured() {
  return APP_SCRIPT_URL && APP_SCRIPT_URL.indexOf('exec') !== -1 && APP_SCRIPT_URL.indexOf('ضع') === -1;
}

// ═══════════ API Helper ═══════════
async function api(action, extra) {
  if (!isConfigured()) throw new Error('افتح config.js وضع رابط Apps Script أولاً');
  var body = Object.assign({ action: action, email: auth.email, password: auth.password }, extra || {});
  var res = await fetch(APP_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  var json = await res.json();
  if (!json.success) throw new Error(json.error || 'خطأ غير معروف');
  return json.data;
}

// ═══════════ Toast ═══════════
function toast(msg, type) {
  var old = document.querySelector('.toast');
  if (old) old.remove();
  var t = document.createElement('div');
  t.className = 'toast ' + (type || 'ok');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 3000);
}

// ═══════════ تسجيل الدخول ═══════════
async function doLogin() {
  var email = document.getElementById('loginEmail').value.trim();
  var password = document.getElementById('loginPassword').value;
  var errBox = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');

  if (!email || !password) {
    errBox.textContent = 'أدخل البريد وكلمة السر';
    errBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'جاري التحقق...';
  errBox.style.display = 'none';

  try {
    auth = { email: email, password: password };
    await api('login');
    sessionStorage.setItem('md_auth', JSON.stringify(auth));
    showPanel();
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
    auth = { email: '', password: '' };
  } finally {
    btn.disabled = false;
    btn.textContent = 'تسجيل الدخول';
  }
}

function logout() {
  sessionStorage.removeItem('md_auth');
  auth = { email: '', password: '' };
  document.getElementById('panel').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function showPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  loadAll();
}

// ═══════════ التبويبات ═══════════
function switchTab(tab) {
  document.getElementById('toolsTab').classList.toggle('hidden', tab !== 'tools');
  document.getElementById('articlesTab').classList.toggle('hidden', tab !== 'articles');
  document.getElementById('tabTools').classList.toggle('active', tab === 'tools');
  document.getElementById('tabArticles').classList.toggle('active', tab === 'articles');
}

// ═══════════ تحميل البيانات ═══════════
async function loadAll() {
  try {
    var data = await api('loginAndFetch', {});
  } catch (e) {}
  try {
    var res = await fetch(APP_SCRIPT_URL + '?action=all');
    var json = await res.json();
    if (!json.success) throw new Error(json.error);
    DATA.tools = json.data.tools || [];
    DATA.articles = json.data.articles || [];
    renderToolsList();
    renderArticlesList();
  } catch (err) {
    toast('تعذر تحميل البيانات: ' + err.message, 'err');
  }
}

// ═══════════ رفع الصور ═══════════
function handleImage(input, type) {
  var file = input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    toast('الصورة كبيرة جداً (الحد 5MB)', 'err');
    input.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = async function (ev) {
    var preview = document.getElementById(type + 'ImgPreview');
    var wrap = document.getElementById(type + 'ImgPreviewWrap');
    var status = document.getElementById(type + 'ImgStatus');
    preview.src = ev.target.result;
    wrap.style.display = 'block';
    status.textContent = '⏳ جاري رفع الصورة...';
    status.className = 'upload-status';
    try {
      var res = await api('uploadImage', { data: ev.target.result, mimeType: file.type });
      uploadedImages[type] = res.url;
      status.textContent = '✓ تم رفع الصورة بنجاح';
      status.className = 'upload-status done';
    } catch (err) {
      status.textContent = '✕ فشل الرفع: ' + err.message;
      status.className = 'upload-status err';
    }
  };
  reader.readAsDataURL(file);
}

function removeImage(type) {
  uploadedImages[type] = '';
  document.getElementById(type + 'ImgPreviewWrap').style.display = 'none';
  document.getElementById(type + 'ImgStatus').textContent = '';
  document.getElementById(type + 'ImgInput').value = '';
}

// ═══════════ إدارة الأدوات ═══════════
async function submitTool() {
  var id = document.getElementById('toolEditingId').value;
  var title = document.getElementById('toolTitle').value.trim();
  var desc = document.getElementById('toolDesc').value.trim();
  var url = document.getElementById('toolUrl').value.trim();
  var img = uploadedImages.tool;

  if (!title || !desc || !url) { toast('املأ كل الحقول المطلوبة', 'err'); return; }
  if (!img) { toast('اختر صورة للأداة (وانتظر رفعها)', 'err'); return; }

  var btn = document.getElementById('toolSubmitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ جاري الحفظ...';

  try {
    if (id) {
      await api('updateTool', { id: id, title: title, description: desc, imageUrl: img, url: url });
      toast('✓ تم حفظ التعديلات');
    } else {
      await api('addTool', { title: title, description: desc, imageUrl: img, url: url });
      toast('🚀 تم نشر الأداة!');
    }
    cancelToolEdit();
    loadAll();
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 نشر الأداة';
  }
}

function editTool(id) {
  var t = DATA.tools.find(function (x) { return x.id === id; });
  if (!t) return;
  document.getElementById('toolEditingId').value = id;
  document.getElementById('toolTitle').value = t.title;
  document.getElementById('toolDesc').value = t.description;
  document.getElementById('toolUrl').value = t.url;
  uploadedImages.tool = t.imageUrl;
  document.getElementById('toolImgPreview').src = t.imageUrl;
  document.getElementById('toolImgPreviewWrap').style.display = 'block';
  document.getElementById('toolFormTitle').textContent = '✏️ تعديل الأداة';
  document.getElementById('toolSubmitBtn').textContent = '💾 حفظ التعديلات';
  document.getElementById('toolCancelBtn').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelToolEdit() {
  document.getElementById('toolEditingId').value = '';
  document.getElementById('toolTitle').value = '';
  document.getElementById('toolDesc').value = '';
  document.getElementById('toolUrl').value = '';
  removeImage('tool');
  document.getElementById('toolFormTitle').textContent = '➕ إضافة أداة جديدة';
  document.getElementById('toolSubmitBtn').textContent = '🚀 نشر الأداة';
  document.getElementById('toolCancelBtn').classList.add('hidden');
}

async function deleteTool(id) {
  if (!confirm('هل أنت متأكد من حذف هذه الأداة؟')) return;
  try {
    await api('deleteTool', { id: id });
    toast('🗑️ تم حذف الأداة');
    loadAll();
  } catch (err) {
    toast(err.message, 'err');
  }
}

function renderToolsList() {
  var list = document.getElementById('toolsList');
  document.getElementById('toolsCount').textContent = DATA.tools.length;
  if (!DATA.tools.length) {
    list.innerHTML = '<div class="empty-list">لا توجد أدوات بعد — أضف أول أداة من الأعلى</div>';
    return;
  }
  list.innerHTML = DATA.tools.map(function (t) {
    return '<div class="item-row">' +
      '<img class="item-thumb" src="' + esc(t.imageUrl) + '" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="item-info"><strong>' + esc(t.title) + '</strong><small>' + esc(t.url) + '</small></div>' +
      '<div class="item-actions">' +
      '<button class="mini-btn edit" onclick="editTool(\'' + esc(t.id) + '\')">تعديل</button>' +
      '<button class="mini-btn del" onclick="deleteTool(\'' + esc(t.id) + '\')">حذف</button>' +
      '</div></div>';
  }).join('');
}

// ═══════════ إدارة المقالات ═══════════
function previewMd() {
  var content = document.getElementById('articleContent').value;
  document.getElementById('mdPreview').innerHTML =
    DOMPurify.sanitize(marked.parse(content || '*ابدأ الكتابة لتظهر المعاينة...*'));
}

async function submitArticle() {
  var id = document.getElementById('articleEditingId').value;
  var title = document.getElementById('articleTitle').value.trim();
  var desc = document.getElementById('articleDesc').value.trim();
  var content = document.getElementById('articleContent').value;
  var img = uploadedImages.article;

  if (!title || !desc) { toast('املأ العنوان والوصف', 'err'); return; }
  if (!content.trim()) { toast('اكتب محتوى المقال', 'err'); return; }
  if (!img) { toast('اختر صورة غلاف (وانتظر رفعها)', 'err'); return; }

  var btn = document.getElementById('articleSubmitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ جاري الحفظ...';

  try {
    if (id) {
      await api('updateArticle', { id: id, title: title, description: desc, imageUrl: img, content: content });
      toast('✓ تم حفظ التعديلات');
    } else {
      await api('addArticle', { title: title, description: desc, imageUrl: img, content: content });
      toast('🚀 تم نشر المقال!');
    }
    cancelArticleEdit();
    loadAll();
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 نشر المقال';
  }
}

function editArticle(id) {
  var a = DATA.articles.find(function (x) { return x.id === id; });
  if (!a) return;
  document.getElementById('articleEditingId').value = id;
  document.getElementById('articleTitle').value = a.title;
  document.getElementById('articleDesc').value = a.description;
  document.getElementById('articleContent').value = a.content || '';
  uploadedImages.article = a.imageUrl;
  document.getElementById('articleImgPreview').src = a.imageUrl;
  document.getElementById('articleImgPreviewWrap').style.display = 'block';
  document.getElementById('articleFormTitle').textContent = '✏️ تعديل المقال';
  document.getElementById('articleSubmitBtn').textContent = '💾 حفظ التعديلات';
  document.getElementById('articleCancelBtn').classList.remove('hidden');
  previewMd();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelArticleEdit() {
  document.getElementById('articleEditingId').value = '';
  document.getElementById('articleTitle').value = '';
  document.getElementById('articleDesc').value = '';
  document.getElementById('articleContent').value = '';
  removeImage('article');
  previewMd();
  document.getElementById('articleFormTitle').textContent = '✍️ إنشاء مقال جديد';
  document.getElementById('articleSubmitBtn').textContent = '🚀 نشر المقال';
  document.getElementById('articleCancelBtn').classList.add('hidden');
}

async function deleteArticle(id) {
  if (!confirm('هل أنت متأكد من حذف هذا المقال؟')) return;
  try {
    await api('deleteArticle', { id: id });
    toast('🗑️ تم حذف المقال');
    loadAll();
  } catch (err) {
    toast(err.message, 'err');
  }
}

function renderArticlesList() {
  var list = document.getElementById('articlesList');
  document.getElementById('articlesCount').textContent = DATA.articles.length;
  if (!DATA.articles.length) {
    list.innerHTML = '<div class="empty-list">لا توجد مقالات بعد — اكتب أول مقال من الأعلى</div>';
    return;
  }
  list.innerHTML = DATA.articles.map(function (a) {
    return '<div class="item-row">' +
      '<img class="item-thumb" src="' + esc(a.imageUrl) + '" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="item-info"><strong>' + esc(a.title) + '</strong><small>' + esc(a.description) + '</small></div>' +
      '<div class="item-actions">' +
      '<button class="mini-btn edit" onclick="editArticle(\'' + esc(a.id) + '\')">تعديل</button>' +
      '<button class="mini-btn del" onclick="deleteArticle(\'' + esc(a.id) + '\')">حذف</button>' +
      '</div></div>';
  }).join('');
}

// ═══════════ بدء التشغيل ═══════════
function esc(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

(function init() {
  var saved = sessionStorage.getItem('md_auth');
  if (saved) {
    try {
      auth = JSON.parse(saved);
      showPanel();
      return;
    } catch (e) {}
  }
  document.getElementById('loginScreen').style.display = 'flex';
})();
</script>
</body>
</html>
